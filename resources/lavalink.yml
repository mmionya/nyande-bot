server:
  port: 2333
  address: 0.0.0.0
lavalink:
  plugins:
    - dependency: dev.lavalink.youtube:youtube-plugin:1.18.2
      repository: https://maven.lavalink.dev/releases
  server:
    password: ${LAVALINK_SERVER_PASSWORD:youshallnotpass}
    sources:
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: false
      vimeo: false
      nico: false
      http: false
      local: false
    playerUpdateInterval: 5
    trackStuckThresholdMs: 10000
plugins:
  youtube:
    enabled: true
    allowSearch: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    allowDirectVideoIds: true
    allowDirectPlaylistIds: false
logging:
  level:
    root: INFO
    lavalink: INFO
