volumes:
  bot-data:

services:
  bot:
    build:
      context: .
      target: ${DOCKER_TARGET:-runtime}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      ALLOWED_LINKS_FILE: /app/data/allowed-links.json
      LINK_MODERATION_FILE: /app/data/link-moderation.json
      BANNED_USERS_FILE: /app/data/banned-users.json
      DISCORD_MUSIC_BACKEND: ${DISCORD_MUSIC_BACKEND:-direct}
      MUSIC_MAX_PLAYERS: ${MUSIC_MAX_PLAYERS:-1}
      DISCORD_LLM_SETTINGS_FILE: /app/data/discord-llm.json
      LLM_HISTORY_FILE: /app/data/llm-history.json
      LLM_MEMORY_FILE: /app/data/llm-memory.db
      CHAT_LOG_FILE: /app/data/chatlog.db
      QUOTE_DB_FILE: /app/data/quotes.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - bot-data:/app/data
    deploy:
      resources:
        limits:
          memory: 2G

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    profiles: [music]
    restart: unless-stopped
    environment:
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      _JAVA_OPTIONS: -Xmx512M
    ports:
      - "127.0.0.1:2333:2333"
    volumes:
      - ./resources/lavalink.yml:/opt/Lavalink/application.yml:ro
